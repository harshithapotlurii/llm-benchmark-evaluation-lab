[project]
name = "llm-benchmark-evaluation-lab"
version = "0.1.0"
requires-python = ">=3.11"
description = "Reproducible LLM evaluation harness with offline fixture"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_eval*"]
